<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -200 400 400" fill="none" stroke="#2F7D6B" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <style>
      @keyframes pdb-spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pdb-spin-rev  { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
      @keyframes pdb-float     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes pdb-glow-pulse { 0%,100% { opacity:.55; } 50% { opacity:.9; } }
      @media (prefers-reduced-motion: reduce) {
        .pdb-outer-ring, .pdb-inner-helix { animation: none !important; }
      }
      .pdb-outer-ring { transform-origin: 0px 0px; animation: pdb-spin-slow 60s linear infinite; }
      .pdb-inner-helix { transform-origin: 0px 0px; animation: pdb-spin-rev 80s linear infinite; }
    </style>
    <radialGradient id="glow" cx="0" cy="0" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F7D6B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2F7D6B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="0" cy="0" r="180" fill="url(#glow)" stroke="none"/>

  <g class="pdb-outer-ring">
    <g opacity="0.55">
      <circle cx="0" cy="-150" r="2.5" fill="#2F7D6B" stroke="none"/>
      <circle cx="106" cy="-106" r="2.5" fill="#2F7D6B" stroke="none"/>
      <circle cx="150" cy="0" r="2.5" fill="#2F7D6B" stroke="none"/>
      <circle cx="106" cy="106" r="2.5" fill="#2F7D6B" stroke="none"/>
      <circle cx="0" cy="150" r="2.5" fill="#2F7D6B" stroke="none"/>
      <circle cx="-106" cy="106" r="2.5" fill="#2F7D6B" stroke="none"/>
      <circle cx="-150" cy="0" r="2.5" fill="#2F7D6B" stroke="none"/>
      <circle cx="-106" cy="-106" r="2.5" fill="#2F7D6B" stroke="none"/>
    </g>
    <circle cx="0" cy="0" r="150" stroke="#2F7D6B" stroke-width="0.6" stroke-dasharray="2 6" opacity="0.35"/>
  </g>

  <g class="pdb-inner-helix">
    <g transform="translate(-60,-80)">
      <path d="M0 0 Q 60 8, 120 0 T 120 32 Q 60 40, 0 32 T 0 64 Q 60 72, 120 64 T 120 96 Q 60 104, 0 96 T 0 128 Q 60 136, 120 128 T 120 160"/>
      <path d="M0 0 V 160" stroke-dasharray="2 5" opacity="0.4"/>
      <path d="M120 0 V 160" stroke-dasharray="2 5" opacity="0.4"/>
      <g fill="#2F7D6B" stroke="none">
        <circle cx="0" cy="0" r="3"/>
        <circle cx="120" cy="0" r="3"/>
        <circle cx="120" cy="32" r="3"/>
        <circle cx="0" cy="32" r="3"/>
        <circle cx="0" cy="64" r="3"/>
        <circle cx="120" cy="64" r="3"/>
        <circle cx="120" cy="96" r="3"/>
        <circle cx="0" cy="96" r="3"/>
        <circle cx="0" cy="128" r="3"/>
        <circle cx="120" cy="128" r="3"/>
        <circle cx="120" cy="160" r="3"/>
      </g>
    </g>
  </g>

  <circle cx="0" cy="0" r="170" stroke="#2F7D6B" stroke-width="1" stroke-dasharray="1068" stroke-dashoffset="1068" opacity="0.5"/>
</svg>
